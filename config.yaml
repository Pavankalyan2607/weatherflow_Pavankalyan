api:
  forecast_url: https://api.open-meteo.com/v1/forecast
  archive_url: https://archive-api.open-meteo.com/v1/archive
  timeout_seconds: 10
  max_retries: 3
  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - apparent_temperature
    - precipitation
    - wind_speed_10m
    - weather_code
    - is_day
  timezone: UTC
cities:
  - {name: London,     latitude: 51.5085,  longitude: -0.1257}
  - {name: Manchester, latitude: 53.48095, longitude: -2.23743}
  - {name: Birmingham, latitude: 52.4814,  longitude: -1.8998}
  - {name: Edinburgh,  latitude: 55.9521,  longitude: -3.1965}
  - {name: Cardiff,    latitude: 51.48,    longitude: -3.18}
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  quarantine_dir: data/quarantine
  database: data/weather.db

dim_date:
  start: 2025-01-01
  end: 2027-12-31
  
data_quality:
  temperature_c:
    min: -30
    max: 45
  humidity_pct:
    min: 0
    max: 100
  feels_like_max_diff_c: 15
  max_staleness_hours: 3
  min_hours_per_city: 24
  report_dir: docs/dq_reports

backfill:
  default_days: 30
  lag_days: 5
  chunk_days: 7
  sleep_seconds: 1
incremental:
  overlap_hours: 2